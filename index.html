<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Hypertrophy Tracker</title>
<style>
:root{--bg:#0b1020;--panel:#151d30;--panel2:#1c2940;--text:#f4f7fb;--muted:#a9b5c8;--accent:#a3e635;--line:#2d3a50;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:88px}
header{padding:20px 16px 12px;background:linear-gradient(135deg,#111827,#1c2940);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:1.35rem;margin:0 0 4px}h2{font-size:1.08rem;margin:0 0 10px}h3{font-size:1rem;margin:0 0 5px}p{margin:5px 0;color:var(--muted)}.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
main{padding:14px;max-width:760px;margin:auto}.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px}.tab{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted);background:#111827;white-space:nowrap;font-weight:650}.tab.active{background:var(--accent);color:#17200b;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:var(--panel2);padding:13px;border-radius:12px}.metric strong{display:block;font-size:1.35rem}.muted{color:var(--muted);font-size:.9rem}
button,.button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:11px 13px;background:var(--accent);color:#17200b;cursor:pointer}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#4b2027;color:#ffd9de;border:1px solid #7f3542}.full{width:100%}
label{display:block;color:var(--muted);font-size:.84rem;margin:8px 0 4px}input,select,textarea{width:100%;background:#0d1526;color:var(--text);border:1px solid #394861;border-radius:9px;padding:11px;font:inherit;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.exercise{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;background:#10182a}.exercise.done{border-color:#648e25}.exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.exercise-head h3{flex:1}.plan{font-size:.83rem;color:var(--muted);margin:4px 0 8px}.badge{font-size:.72rem;background:#2b3b21;color:#d9f99d;padding:4px 8px;border-radius:999px;white-space:nowrap}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.set-row{display:grid;grid-template-columns:42px 1fr 1fr;gap:7px;align-items:center;margin:7px 0}.set-row .set-label{font-size:.82rem;color:var(--muted)}.set-row input{padding:9px 7px}.exercise-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.exercise-tools button{font-size:.82rem;padding:8px 10px}.next{font-size:.88rem;color:#d9f99d;margin-top:8px;background:#1d2b1a;padding:9px;border-radius:8px}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid var(--line);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:flex;gap:5px;justify-content:space-around;z-index:8}.nav button{background:transparent;color:var(--muted);padding:8px 5px;font-size:.75rem;flex:1}.nav button.active{color:var(--accent);background:#1c2940}.small{font-size:.78rem}.statline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.statline:last-child{border:0}.empty{padding:24px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#e5f9b5;color:#17200b;padding:10px 15px;border-radius:999px;font-weight:700;z-index:20;display:none;max-width:90%;text-align:center}
@media(min-width:620px){main{padding:20px}.exercise{padding:16px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head>
<body>
<header><div class="eyebrow">12-month training log</div><h1>Hypertrophy Tracker</h1><p id="todayLine">Your plan, progress, and check-ins — saved on this device.</p>
<div class="tabs" id="workoutTabs"></div></header>
<main>
<section id="homeView"></section><section id="workoutView" class="hidden"></section><section id="weightView" class="hidden"></section><section id="checkinView" class="hidden"></section><section id="cardioView" class="hidden"></section><section id="volumeView" class="hidden"></section><section id="settingsView" class="hidden"></section>
</main>
<nav class="nav">
<button data-view="home" class="active">⌂<br>Home</button><button data-view="weight">⚖<br>Weight</button><button data-view="checkin">✓<br>Check-in</button><button data-view="cardio">↗<br>Cardio</button><button data-view="volume">▥<br>Volume</button><button data-view="settings">⚙<br>More</button>
</nav><div class="toast" id="toast"></div>
<script>
const PROGRAM = {"startDate": "2026-10-25", "workouts": [{"id": "Sun Lower Strength", "day": "Sunday", "label": "Lower Strength", "offset": 0, "exercises": [{"name": "Hack squat (trial back squat after 4+ pain-free wks)", "plan": "4 x 6-10 · RIR 2,2,1,1 · Rest 3 min", "sets": 4, "low": 6, "high": 10}, {"name": "Romanian deadlift (straps OK)", "plan": "3 x 6-10 · RIR 2 · Rest 2-3 min", "sets": 3, "low": 6, "high": 10}, {"name": "Lying leg curl", "plan": "3 x 8-12 · RIR 1 · Rest 90 s", "sets": 3, "low": 8, "high": 12}, {"name": "Standing calf raise (full stretch, 2s pause)", "plan": "3 x 8-12 · RIR 1 · Rest 90 s", "sets": 3, "low": 8, "high": 12}]}, {"id": "Mon Upper Strength", "day": "Monday", "label": "Upper Strength", "offset": 1, "exercises": [{"name": "Neutral-grip DB bench, elbows ~45° (or converging machine)", "plan": "4 x 6-10 · RIR 2,2,1,1 · Rest 2-3 min", "sets": 4, "low": 6, "high": 10}, {"name": "Chest-supported row, neutral grip", "plan": "3 x 6-10 · RIR 1-2 · Rest 2-3 min", "sets": 3, "low": 6, "high": 10}, {"name": "Neutral-grip machine shoulder press (fallback: landmine)", "plan": "3 x 6-10 · RIR 1-2 · Rest 2-3 min", "sets": 3, "low": 6, "high": 10}, {"name": "Neutral-grip lat pulldown", "plan": "3 x 8-12 · RIR 1-2 · Rest 2 min", "sets": 3, "low": 8, "high": 12}, {"name": "Smith or DB shrug, 1s pause", "plan": "3 x 8-12 · RIR 1 · Rest 90 s", "sets": 3, "low": 8, "high": 12}, {"name": "Machine lateral raise", "plan": "3 x 12-20 · RIR 0-1 · Rest 60-90 s", "sets": 3, "low": 12, "high": 20}, {"name": "Cable crunch", "plan": "3 x 8-15 · RIR 1 · Rest 90 s", "sets": 3, "low": 8, "high": 15}]}, {"id": "Wed Lower Hypertrophy", "day": "Wednesday", "label": "Lower Hypertrophy", "offset": 3, "exercises": [{"name": "Leg press (deep range)", "plan": "3 x 10-15 · RIR 1 · Rest 2 min", "sets": 3, "low": 10, "high": 15}, {"name": "Seated leg curl", "plan": "3 x 10-15 · RIR 0-1 · Rest 90 s", "sets": 3, "low": 10, "high": 15}, {"name": "Leg extension", "plan": "3 x 12-15 · RIR 0-1 · Rest 90 s", "sets": 3, "low": 12, "high": 15}, {"name": "Seated calf raise", "plan": "3 x 12-15 · RIR 0-1 · Rest 60-90 s", "sets": 3, "low": 12, "high": 15}, {"name": "Hanging leg raise (fallback: captain's chair)", "plan": "3 x 10-15 · RIR 1 · Rest 60-90 s", "sets": 3, "low": 10, "high": 15}]}, {"id": "Thu Upper Hypertrophy", "day": "Thursday", "label": "Upper Hypertrophy", "offset": 4, "exercises": [{"name": "Incline neutral-grip DB or machine press", "plan": "3 x 8-12 · RIR 1 · Rest 2 min", "sets": 3, "low": 8, "high": 12}, {"name": "Seated cable row, V-handle", "plan": "3 x 10-15 · RIR 1 · Rest 90-120 s", "sets": 3, "low": 10, "high": 15}, {"name": "Dips (chest-lean, comfortable depth)", "plan": "3 x 8-12 · RIR 1 · Rest 2 min", "sets": 3, "low": 8, "high": 12}, {"name": "Leaning cable lateral raise *", "plan": "4 x 12-20 · RIR 0-1 · Rest 60-90 s", "sets": 4, "low": 12, "high": 20}, {"name": "Reverse pec deck, neutral handles, light *", "plan": "3 x 15-20 · RIR 0-1 · Rest 60 s", "sets": 3, "low": 15, "high": 20}, {"name": "Rope overhead triceps extension **", "plan": "2 x 10-15 · RIR 1 · Rest 90 s", "sets": 2, "low": 10, "high": 15}, {"name": "Incline DB curl **", "plan": "3 x 10-15 · RIR 1 · Rest 90 s", "sets": 3, "low": 10, "high": 15}, {"name": "Cable or machine shrug", "plan": "2 x 10-15 · RIR 1 · Rest 60-90 s", "sets": 2, "low": 10, "high": 15}, {"name": "Decline sit-up or machine crunch", "plan": "2 x 10-15 · RIR 1 · Rest 60 s", "sets": 2, "low": 10, "high": 15}]}], "volume": [{"muscle": "Chest", "direct": 10, "indirect": 1.5, "added": 0, "target": "10-14"}, {"muscle": "Lats/upper back", "direct": 9, "indirect": 1, "added": 0, "target": "10-14"}, {"muscle": "Side delts", "direct": 7, "indirect": 1.5, "added": 0, "target": "10-16"}, {"muscle": "Rear delts", "direct": 3, "indirect": 4.5, "added": 0, "target": "6-10"}, {"muscle": "Traps", "direct": 5, "indirect": 3, "added": 0, "target": "6-10"}, {"muscle": "Triceps", "direct": 2, "indirect": 6, "added": 0, "target": "6-10"}, {"muscle": "Biceps", "direct": 3, "indirect": 4.5, "added": 0, "target": "6-10"}, {"muscle": "Abs", "direct": 8, "indirect": 0, "added": 0, "target": "6-10"}, {"muscle": "Quads", "direct": 10, "indirect": 0, "added": 0, "target": "10-14"}, {"muscle": "Hamstrings", "direct": 9, "indirect": 0, "added": 0, "target": "8-12"}, {"muscle": "Calves", "direct": 6, "indirect": 0, "added": 0, "target": "6-10"}, {"muscle": "Blue = hardcoded starting figures from the program design (indirect shares are estimates).", "direct": 0, "indirect": 0, "added": 0, "target": ""}]};
const STORE = "hypertrophy-tracker-v1";
const cloneProgram = () => PROGRAM.workouts.map((w,wi)=>({...w,exercises:w.exercises.map((ex,ei)=>({...ex,id:`ex-${wi}-${ei}`}))}));
const blank = () => ({startDate:PROGRAM.startDate, logs:{}, weights:[], checkins:[], cardio:[], volumeAdded:{}, notes:{}, workouts:cloneProgram()});
let state = loadState(), currentWorkout = (state.workouts||PROGRAM.workouts)[0].id, activeView="home";
function loadState(){try{let saved=JSON.parse(localStorage.getItem(STORE)||"{}");let base=blank();let out={...base,...saved};if(!Array.isArray(out.workouts))out.workouts=cloneProgram();out.workouts.forEach((w,wi)=>w.exercises.forEach((ex,ei)=>{if(!ex.id)ex.id=`ex-${wi}-${ei}`}));return out}catch(e){return blank()}}
function workouts(){return state.workouts||PROGRAM.workouts}
function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function addDays(s,n){let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function weekNum(){let now=new Date(),start=new Date(state.startDate+"T00:00:00");return Math.max(1,Math.min(52,Math.floor((now-start)/604800000)+1))}
function logKey(wid,exId,week){return wid+"|"+exId+"|"+week}
function getLog(wid,ex,week,index){let saved=state.logs[logKey(wid,ex.id,week)];if(saved)return saved;let legacy=state.logs[wid+"|"+index+"|"+week];if(legacy&&legacy.sets===undefined){let sets=Array.from({length:4},(_,i)=>({load:i===0?legacy.load||"":"",reps:i===0?legacy.reps||"":""}));return {sets,load:legacy.load||"",reps:legacy.reps||""}}return {sets:Array.from({length:4},()=>({load:"",reps:""})),load:"",reps:""}}
function lastLog(wid,ex,week,index){for(let w=week-1;w>=1;w--){let x=getLog(wid,ex,w,index);if((x.sets||[]).some(s=>s.load!==""||s.reps!=="")||x.load!==""||x.reps!=="")return {...x,week:w}}return null}
function progression(ex,log){let sets=(log?.sets||[]).filter(s=>s.reps!==""&&s.reps!=null).map(s=>+s.reps);let best=sets.length?Math.min(...sets):+(log?.reps||0);let loads=(log?.sets||[]).filter(s=>s.load!=="").map(s=>+s.load);let load=loads.length?loads[loads.length-1]:log?.load;if(!log||!best)return "Log each set above. Aim for "+ex.low+"–"+ex.high+" reps per set.";if(best>=ex.high)return "UP: all logged sets reached the top of the range; consider adding 2.5–5% load.";return "HOLD: try to add a rep while maintaining good form."}
function toast(msg){let el=document.getElementById("toast");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",1800)}
function setView(view){activeView=view;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));["home","workout","weight","checkin","cardio","volume","settings"].forEach(v=>document.getElementById(v+"View").classList.toggle("hidden",v!==view));render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
function renderTabs(){let el=document.getElementById("workoutTabs");el.innerHTML=workouts().map(w=>`<button class="tab ${w.id===currentWorkout?"active":""}" data-w="${esc(w.id)}">${w.day.slice(0,3)} · ${esc(w.label)}</button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>{currentWorkout=b.dataset.w;setView("workout")})}
function render(){renderTabs();document.getElementById("todayLine").textContent="Week "+weekNum()+" · Start date "+fmtDate(state.startDate)+" · Data stays on this device.";renderHome();renderWorkout();renderWeight();renderCheckin();renderCardio();renderVolume();renderSettings()}
function renderHome(){let el=document.getElementById("homeView");let recent=state.weights.filter(x=>x.weight!==""&&x.weight!=null).slice(-7);let avg=recent.length?recent.reduce((a,x)=>a+ +x.weight,0)/recent.length:null;let today=new Date().toISOString().slice(0,10);let w=workouts().find(x=>x.offset===((new Date().getDay()+0)%7))||workouts()[0];let completed=Object.keys(state.logs).filter(k=>{let x=state.logs[k];return x.load!==""&&x.reps!==""}).length;
el.innerHTML=`<div class="grid"><div class="metric"><span class="muted">Program week</span><strong>${weekNum()} / 52</strong></div><div class="metric"><span class="muted">Logged lifts</span><strong>${completed}</strong></div><div class="metric"><span class="muted">Latest 7 weigh-ins avg (lbs)</span><strong>${avg?avg.toFixed(1):"—"} lbs</strong></div><div class="metric"><span class="muted">Cardio sessions</span><strong>${state.cardio.length}</strong></div></div>
<div class="card" style="margin-top:12px"><div class="eyebrow">Quick start</div><h2>Log a workout</h2><p>Tap a training day, enter the load and fewest reps achieved across working sets, and use the next-step cue to progress.</p><div class="grid">${workouts().map(x=>`<button class="secondary" onclick="currentWorkout='${x.id.replace(/'/g,"\\'")}';setView('workout')">${x.day}<br><span class="small">${esc(x.label)}</span></button>`).join("")}</div></div>
<div class="card"><h2>Weekly schedule</h2><div class="statline"><span>Sun · Lower strength</span><span class="muted">Lift</span></div><div class="statline"><span>Mon · Upper strength</span><span class="muted">Lift</span></div><div class="statline"><span>Tue · Zone 2 bike</span><span class="muted">35–45 min · RPE 3–4</span></div><div class="statline"><span>Wed · Lower hypertrophy</span><span class="muted">Lift</span></div><div class="statline"><span>Thu · Upper hypertrophy</span><span class="muted">Lift</span></div><div class="statline"><span>Fri · Bike intervals</span><span class="muted">20–25 min · RPE 8–9</span></div><div class="statline"><span>Sat · Off or Zone 2</span><span class="muted">Optional 30 min</span></div></div>
<div class="card"><h2>Progression rule</h2><p>When you reach the top of the rep range at the target effort, add about 2.5–5% load and restart near the bottom of the range. Log the fewest reps across your working sets.</p></div>`}
function renderWorkout(){let el=document.getElementById("workoutView"),w=workouts().find(x=>x.id===currentWorkout)||workouts()[0],wk=+(document.getElementById("editWeek")?.value||weekNum());el.innerHTML=`<div class="card"><div class="eyebrow">${w.day} · Week ${wk}</div><h2>${esc(w.label)}</h2><p>Track up to four sets per exercise. Enter the load and reps for each set separately; prescribed sets remain shown for reference.</p><div class="row"><div><label>Week to edit</label><select id="editWeek">${Array.from({length:52},(_,i)=>`<option value="${i+1}" ${i+1===wk?"selected":""}>Week ${i+1}</option>`).join("")}</select></div><div><label>Session date</label><input type="date" id="sessionDate" value="${addDays(state.startDate,(parseInt(document.getElementById("editWeek")?.value||wk)-1)*7+w.offset)}"></div></div><label>Session pain (0–10)</label><input id="pain" type="number" min="0" max="10" step="1" placeholder="Worst pain during session" value="${esc(state.notes[w.id+"|"+wk]?.pain??"")}"><label>Session notes</label><textarea id="sessionNotes" rows="2" placeholder="Anything to remember…">${esc(state.notes[w.id+"|"+wk]?.text??"")}</textarea></div>
${w.exercises.map((ex,i)=>{let log=getLog(w.id,ex,wk,i),prev=lastLog(w.id,ex,wk,i),sets=log.sets||Array.from({length:4},()=>({load:"",reps:""}));return `<div class="exercise ${(sets.some(s=>s.load!==""&&s.reps!==""))?"done":""}"><div class="exercise-head"><h3>${i+1}. ${esc(ex.name)}</h3><span class="badge">Plan: ${ex.sets} sets</span></div><div class="plan">${esc(ex.plan||`${ex.sets} sets · ${ex.low}–${ex.high} reps`)}</div>${prev?`<p class="small">Previous logged · Wk ${prev.week}: ${(prev.sets||[]).filter(s=>s.load!==""||s.reps!=="").map((s,j)=>`S${j+1} ${esc(s.load||"—")} lb × ${esc(s.reps||"—")}`).join(" · ")||`${esc(prev.load||"—")} × ${esc(prev.reps||"—")} reps`}</p>`:`<p class="small">Target: ${ex.low}–${ex.high} reps per set · four tracking slots</p>`}<div class="set-row"><span class="set-label">Set</span><span class="set-label">Load (lbs)</span><span class="set-label">Reps</span></div>${Array.from({length:4},(_,si)=>{let set=sets[si]||{load:"",reps:""};return `<div class="set-row"><span class="set-label">${si+1}</span><input inputmode="decimal" type="number" min="0" step="any" data-ex="${i}" data-set="${si}" data-field="load" value="${esc(set.load)}" placeholder="lbs"><input inputmode="numeric" type="number" min="0" step="1" data-ex="${i}" data-set="${si}" data-field="reps" value="${esc(set.reps)}" placeholder="reps"></div>`}).join("")}<div class="next">${esc(progression(ex,log))}</div><div class="exercise-tools"><button class="secondary" onclick="editExercise('${w.id}',${i})">Edit</button><button class="secondary" onclick="moveExercise('${w.id}',${i},-1)" ${i===0?"disabled":""}>Move up</button><button class="secondary" onclick="moveExercise('${w.id}',${i},1)" ${i===w.exercises.length-1?"disabled":""}>Move down</button><button class="danger" onclick="removeExercise('${w.id}',${i})">Remove</button></div></div>`}).join("")}
<div class="card"><h2>Manage workout</h2><p>Add a movement or edit the exercise list for this day. Exercise changes are saved on this device.</p><button class="full" onclick="addExercise('${w.id}')">+ Add exercise</button></div><button class="full" onclick="saveWorkout('${w.id}')">Save ${esc(w.day)} workout</button><p class="small" style="text-align:center;margin-top:10px">Entries and exercise changes save to this device. Export a backup in More.</p>`;
document.getElementById("editWeek").onchange=()=>{renderWorkout()};
}
function saveWorkout(wid){let w=workouts().find(x=>x.id===wid),wk=+(document.getElementById("editWeek").value||weekNum());let grouped={};document.querySelectorAll("#workoutView input[data-ex]").forEach(inp=>{let idx=+inp.dataset.ex,ex=w.exercises[idx],si=+inp.dataset.set;let key=logKey(wid,ex.id,wk);if(!grouped[key])grouped[key]=getLog(wid,ex,wk,idx);if(!grouped[key].sets)grouped[key].sets=Array.from({length:4},()=>({load:"",reps:""}));grouped[key].sets[si][inp.dataset.field]=inp.value;});Object.entries(grouped).forEach(([key,log])=>{let nonempty=log.sets.filter(x=>x.load!==""||x.reps!=="");log.load=nonempty.length?nonempty[nonempty.length-1].load:"";let repVals=nonempty.filter(x=>x.reps!=="").map(x=>+x.reps);log.reps=repVals.length?String(Math.min(...repVals)):"";state.logs[key]=log});state.notes[wid+"|"+wk]={pain:document.getElementById("pain").value,text:document.getElementById("sessionNotes").value,date:document.getElementById("sessionDate").value};save();render();toast("Workout saved")}
function editExercise(wid,index){let w=workouts().find(x=>x.id===wid),ex=w.exercises[index];let name=prompt("Exercise name",ex.name);if(name===null)return;if(!name.trim()){alert("Exercise name cannot be blank.");return}let sets=prompt("Prescribed working sets (tracking always has 4 slots)",String(ex.sets||3));if(sets===null)return;let low=prompt("Lowest target reps",String(ex.low||8));if(low===null)return;let high=prompt("Highest target reps",String(ex.high||12));if(high===null)return;let plan=prompt("Plan notes (optional: RIR, rest, cues)",ex.plan||"");if(plan===null)return;ex.name=name.trim();ex.sets=Math.max(1,Math.min(4,parseInt(sets)||3));ex.low=Math.max(1,parseInt(low)||8);ex.high=Math.max(ex.low,parseInt(high)||12);ex.plan=plan.trim()||`${ex.sets} x ${ex.low}-${ex.high} reps`;save();render();toast("Exercise updated")}
function addExercise(wid){let w=workouts().find(x=>x.id===wid);let name=prompt("New exercise name");if(!name||!name.trim())return;let sets=prompt("Prescribed working sets (tracking has 4 slots)","3");if(sets===null)return;let low=prompt("Lowest target reps","8");if(low===null)return;let high=prompt("Highest target reps","12");if(high===null)return;let plan=prompt("Plan notes (RIR, rest, cues)",`${sets} x ${low}-${high} reps`)||"";w.exercises.push({id:"custom-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),name:name.trim(),sets:Math.max(1,Math.min(4,parseInt(sets)||3)),low:Math.max(1,parseInt(low)||8),high:Math.max(parseInt(low)||8,parseInt(high)||12),plan});save();render();toast("Exercise added")}
function removeExercise(wid,index){let w=workouts().find(x=>x.id===wid),ex=w.exercises[index];if(!confirm(`Remove ${ex.name} from this workout? Existing history is kept in your saved data, but this exercise will no longer appear in the program.`))return;w.exercises.splice(index,1);save();render();toast("Exercise removed")}
function moveExercise(wid,index,dir){let w=workouts().find(x=>x.id===wid),to=index+dir;if(to<0||to>=w.exercises.length)return;[w.exercises[index],w.exercises[to]]=[w.exercises[to],w.exercises[index]];save();render();toast("Exercise order updated")}
function renderWeight(){let el=document.getElementById("weightView"),sorted=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),last=sorted.slice(-10).reverse(),recent=sorted.filter(x=>x.weight!==""&&x.weight!=null).slice(-7),avg=recent.length?recent.reduce((a,x)=>a+ +x.weight,0)/recent.length:null;el.innerHTML=`<div class="card"><div class="eyebrow">Daily body weight</div><h2>Morning weigh-in</h2><p>Use the 7-day average rather than reacting to one day.</p><form id="weightForm"><label>Date</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"><label>Body weight (lbs)</label><input name="weight" type="number" step="any" required inputmode="decimal" placeholder="e.g. 185.4"><button class="full" style="margin-top:12px">Save weigh-in</button></form><div class="grid" style="margin-top:12px"><div class="metric"><span class="muted">Current 7-entry avg (lbs)</span><strong>${avg?avg.toFixed(2):"—"} lbs</strong></div><div class="metric"><span class="muted">Total weigh-ins</span><strong>${sorted.length}</strong></div></div></div><div class="card"><h2>Recent weigh-ins</h2>${last.length?last.map(x=>`<div class="statline"><span>${fmtDate(x.date)}</span><strong>${esc(x.weight)}</strong><button class="danger" style="padding:6px 9px" onclick="deleteWeight('${x.date}')">Delete</button></div>`).join(""):`<div class="empty">No weigh-ins yet.</div>`}</div>`;
document.getElementById("weightForm").onsubmit=e=>{e.preventDefault();let d=e.target.date.value,v=e.target.weight.value;state.weights=state.weights.filter(x=>x.date!==d);state.weights.push({date:d,weight:v});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast("Weigh-in saved")}}
function deleteWeight(d){state.weights=state.weights.filter(x=>x.date!==d);save();render()}
function renderCheckin(){let el=document.getElementById("checkinView"),c=state.checkins[state.checkins.length-1]||{};el.innerHTML=`<div class="card"><div class="eyebrow">Weekly review</div><h2>Sunday check-in</h2><p>Measure under similar conditions each week. Body weight uses lbs; body measurements use inches.</p><form id="checkinForm"><label>Week ending / check-in date</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"><div class="grid">${["avgWeight:Average weight (lbs)","waist:Waist (in)","chest:Chest (in)","shoulders:Shoulders (in)","arm:Arm (in)","thigh:Thigh (in)","sleep:Sleep hours","jointPain:Joint pain (0–10)","restingHR:Resting heart rate (bpm)"].map(s=>{let [k,l]=s.split(":");return `<div><label>${l}</label><input name="${k}" type="number" step="any" ${k==="jointPain"?'min="0" max="10"':""} value="${esc(c[k]??"")}" placeholder="—"></div>`}).join("")}</div><label>Strength / recovery notes</label><textarea name="notes" rows="3" placeholder="Performance trend, fatigue, sleep, motivation…">${esc(c.notes??"")}</textarea><button class="full" style="margin-top:12px">Save check-in</button></form></div><div class="card"><h2>Recent check-ins</h2>${state.checkins.length?[...state.checkins].reverse().slice(0,8).map(x=>`<div class="statline"><span>${fmtDate(x.date)}<br><span class="small muted">Avg wt ${esc(x.avgWeight||"—")} lbs · Waist ${esc(x.waist||"—")} in · Sleep ${esc(x.sleep||"—")}h</span></span><button class="danger" style="padding:6px 9px" onclick="deleteCheckin('${x.date}')">Delete</button></div>`).join(""):`<div class="empty">No check-ins yet.</div>`}</div><div id="measurementAnalytics"></div><div class="card"><h2>Fatigue / deload reminder</h2><p>If 2 or more are present—performance down for 2 sessions, resting HR up 5+ bpm, sleep under 6.5 hours, joint pain that won't warm up, or low motivation—reduce fatigue. First swap HIIT for Zone 2, then consider cutting a set; if it persists, use a deload week.</p></div>`;
document.getElementById("checkinForm").onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());state.checkins=state.checkins.filter(x=>x.date!==obj.date);state.checkins.push(obj);state.checkins.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast("Check-in saved")};renderMeasurementAnalytics()}
function renderMeasurementAnalytics(){let el=document.getElementById("measurementAnalytics");if(!el)return;let fields=[{key:"waist",label:"Waist",unit:"in"},{key:"chest",label:"Chest",unit:"in"},{key:"shoulders",label:"Shoulders",unit:"in"},{key:"arm",label:"Arm",unit:"in"},{key:"thigh",label:"Thigh",unit:"in"},{key:"avgWeight",label:"Average body weight",unit:"lbs"}];let rows=[...state.checkins].filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));let fmt=v=>v===null||v===undefined||!Number.isFinite(v)?"—":v.toFixed(2);let avg=(arr,key)=>{let vals=arr.map(x=>Number(x[key])).filter(v=>Number.isFinite(v)&&String(v)!==""&&v!==0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};let delta=(a,b)=>a===null||b===null?"—":`${a-b>0?"+":""}${fmt(a-b)}`;let latest=rows.slice(-1)[0],previous=rows.slice(-2,-1)[0],recent4=rows.slice(-4),prior4=rows.slice(-8,-4);el.innerHTML=`<div class="card"><div class="eyebrow">Progress trends</div><h2>Measurement averages & comparisons</h2><p>Weekly change compares your latest check-in with the previous one. Monthly trend compares the average of your latest four check-ins with the previous four. Values are calculated from saved check-ins; missing entries are skipped.</p>${rows.length?fields.map(f=>{let cur=latest&&latest[f.key]!==""&&latest[f.key]!=null&&Number.isFinite(Number(latest[f.key]))?Number(latest[f.key]):null,prev=previous&&previous[f.key]!==""&&previous[f.key]!=null&&Number.isFinite(Number(previous[f.key]))?Number(previous[f.key]):null,ra=avg(recent4,f.key),pa=avg(prior4,f.key);return `<div class="exercise"><div class="exercise-head"><h3>${f.label}</h3><span class="badge">${f.unit}</span></div><div class="statline"><span>Latest check-in</span><strong>${fmt(cur)} ${f.unit}</strong></div><div class="statline"><span>Weekly change</span><strong>${delta(cur,prev)} ${f.unit}</strong></div><div class="statline"><span>Latest 4 check-ins avg</span><strong>${fmt(ra)} ${f.unit}</strong></div><div class="statline"><span>Prior 4 check-ins avg</span><strong>${fmt(pa)} ${f.unit}</strong></div><div class="statline"><span>Monthly trend change</span><strong>${delta(ra,pa)} ${f.unit}</strong></div></div>`}).join(""):`<div class="empty">Save at least one weekly check-in to start seeing measurement trends.</div>`}<p class="small">For a meaningful monthly comparison, aim for about eight weekly check-ins. With fewer entries, the app shows available averages and leaves unavailable comparisons blank.</p></div>`}
function deleteCheckin(d){state.checkins=state.checkins.filter(x=>x.date!==d);save();render()}
function renderCardio(){let el=document.getElementById("cardioView");el.innerHTML=`<div class="card"><div class="eyebrow">Conditioning log</div><h2>Log cardio</h2><p>Zone 2: RPE 3–4, able to speak in full sentences. HIIT: RPE 8–9 on work intervals. Bike, incline walk, or elliptical.</p><form id="cardioForm"><label>Date</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"><div class="row"><div><label>Type</label><select name="type"><option>Zone 2</option><option>HIIT</option><option>Easy / recovery</option></select></div><div><label>Machine</label><select name="machine"><option>Bike</option><option>Incline walk</option><option>Elliptical</option><option>Other</option></select></div></div><div class="grid"><div><label>Minutes</label><input name="minutes" type="number" min="1" required placeholder="35"></div><div><label>RPE (1–10)</label><input name="rpe" type="number" min="1" max="10" step="1" placeholder="4"></div><div><label>Average heart rate</label><input name="hr" type="number" min="1" placeholder="Optional"></div></div><label>Notes</label><textarea name="notes" rows="2" placeholder="Intervals, resistance, how it felt…"></textarea><button class="full" style="margin-top:12px">Save cardio</button></form></div><div class="card"><h2>Cardio history</h2>${state.cardio.length?[...state.cardio].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20).map(x=>`<div class="statline"><span><strong>${esc(x.type)} · ${esc(x.minutes)} min</strong><br><span class="small muted">${fmtDate(x.date)} · ${esc(x.machine)} · RPE ${esc(x.rpe||"—")}</span></span><button class="danger" style="padding:6px 9px" onclick="deleteCardio('${x.id}')">Delete</button></div>`).join(""):`<div class="empty">No cardio sessions logged.</div>`}</div>`;
document.getElementById("cardioForm").onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());obj.id=Date.now().toString();state.cardio.push(obj);save();render();toast("Cardio saved")}}
function deleteCardio(id){state.cardio=state.cardio.filter(x=>x.id!==id);save();render()}
function renderVolume(){let el=document.getElementById("volumeView");el.innerHTML=`<div class="card"><div class="eyebrow">Weekly volume audit</div><h2>Sets by muscle group</h2><p>Direct sets count 1.0; indirect compound work is estimated at 0.5. Change added sets only when you intentionally progress volume.</p>${PROGRAM.volume.map((m,i)=>{let added=+(state.volumeAdded[m.muscle]??m.added),direct=+m.direct+added,effective=direct+(+m.indirect);return `<div class="exercise"><div class="exercise-head"><h3>${esc(m.muscle)}</h3><span class="badge">Target ${esc(m.target)}</span></div><div class="grid"><div><span class="muted small">Direct now</span><strong>${direct}</strong></div><div><span class="muted small">Effective est.</span><strong>${effective}</strong></div></div><label>Additional direct sets</label><input type="number" min="0" max="20" step="1" value="${added}" data-muscle="${esc(m.muscle)}"></div>`}).join("")}<button class="full" onclick="saveVolume()">Save volume changes</button></div>`}
function saveVolume(){document.querySelectorAll("#volumeView input[data-muscle]").forEach(x=>state.volumeAdded[x.dataset.muscle]=+x.value);save();render();toast("Volume updated")}
function renderSettings(){let el=document.getElementById("settingsView");el.innerHTML=`<div class="card"><div class="eyebrow">Program setup</div><h2>Start date</h2><p>Default from your spreadsheet: ${fmtDate(PROGRAM.startDate)}. Change this to reset the program calendar; existing logs remain saved.</p><label>Program start (Sunday)</label><input type="date" id="startDate" value="${esc(state.startDate)}"><button class="full" style="margin-top:10px" onclick="saveStart()">Save start date</button></div><div class="card"><h2>Exercise editing</h2><p>Open any workout day to edit, add, reorder, or remove exercises. Each exercise has four set-tracking rows; the prescribed set count remains editable.</p></div><div class="card"><h2>Backup & restore</h2><p>Export a JSON backup regularly. It includes your logs and settings, and can be imported on this or another device.</p><button class="full" onclick="exportData()">Export backup</button><label>Restore from backup file</label><input type="file" id="importFile" accept=".json,application/json"><button class="secondary full" style="margin-top:8px" onclick="importData()">Import backup</button></div><div class="card"><h2>Data and privacy</h2><p>Everything is stored locally in this browser on this device. There is no account or cloud sync. Clearing browser data may erase your logs, so keep backups.</p><button class="danger full" onclick="resetData()">Erase all app data</button></div><div class="card"><h2>Training reminders</h2><p>Pressing / biceps: up to about 3/10 discomfort may be acceptable if it returns to baseline within 24 hours. Above 4/10, lingering pain, worsening symptoms, sharp pain, weakness, or visible changes are reasons to step down and consider a qualified clinician.</p><p>Nutrition trend target from the spreadsheet: gain about 0.1–0.25% body weight per week. Use the 4-week trend rather than daily fluctuations.</p></div>`}
function saveStart(){let v=document.getElementById("startDate").value;if(!v)return;state.startDate=v;save();render();toast("Start date saved")}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="hypertrophy-tracker-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);toast("Backup exported")}
function importData(){let f=document.getElementById("importFile").files[0];if(!f){toast("Choose a backup file first");return}let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result);if(!parsed.logs||!parsed.startDate)throw Error();if(!confirm("Replace current app data with this backup?"))return;state={...blank(),...parsed};if(!Array.isArray(state.workouts))state.workouts=cloneProgram();state.workouts.forEach((w,wi)=>w.exercises.forEach((ex,ei)=>{if(!ex.id)ex.id=`ex-${wi}-${ei}`}));save();currentWorkout=workouts()[0]?.id||PROGRAM.workouts[0].id;render();toast("Backup restored")}catch(e){alert("That file does not look like a valid tracker backup.")}};reader.readAsText(f)}
function resetData(){if(confirm("Permanently erase all tracker data saved in this browser? Export a backup first if you need one.")){state=blank();save();render();toast("App data erased")}}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
